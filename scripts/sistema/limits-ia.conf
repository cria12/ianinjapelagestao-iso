# /etc/security/limits.d/90-ianinja-ia.conf — instalado por scripts/f09-live.sh
# Lido pelo pam_limits (sessões login, su, sudo e sshd).
# Nota: as linhas com '*' não se aplicam ao root; o root tem linhas próprias.
#
# memlock ilimitado: o llama.cpp com --mlock fixa o modelo em RAM para que
# não vá para a swap/zram (sem isto o limite por omissão é 8 MiB).
*        -    memlock    unlimited
root     -    memlock    unlimited
ninja    -    memlock    unlimited
#
# ficheiros abertos: compilações com o ninja (muitas tarefas em paralelo) e
# servidores de LLM com muitas ligações (por omissão 1024).
*        -    nofile     65536
root     -    nofile     65536
ninja    -    nofile     65536
#
# processos/threads do utilizador ninja (compilações paralelas, llama.cpp).
ninja    -    nproc      65536
