# >>> ianinjapelagestao-sistema: afinação de memória para IA (gerido por scripts/f09-live.sh)
# zram é muito mais rápido que um disco: preferir trocar páginas anónimas
# frias para a zram em vez de deitar fora a cache de ficheiros (o modelo
# GGUF é lido por mmap e vive na page cache).
vm.swappiness = 100
# zram não tem custo de procura: ler páginas de swap uma a uma
# (sem read-ahead de 8 páginas, que só gasta CPU a descomprimir).
vm.page-cluster = 0
# O llama.cpp/ggml reserva buffers grandes (pesos, KV cache) que só toca
# parcialmente; com a heurística por omissão (0) reservas grandes podem
# falhar com ENOMEM numa máquina com pouca RAM mesmo havendo zram livre.
# Com 1 a reserva nunca falha; o OOM killer continua a proteger o sistema.
vm.overcommit_memory = 1
# Muitos mapeamentos de memória (mmap do modelo, bibliotecas, threads):
# valor alto como nas distribuições recentes (por omissão 65530).
vm.max_map_count = 1048576
# Manter mais memória livre de reserva para a zram poder comprimir em picos.
vm.min_free_kbytes = 65536
# (kernel.numa_balancing não é definido: o kernel é compilado sem
#  NUMA_BALANCING, como recomenda o llama.cpp para --numa.)
# <<< ianinjapelagestao-sistema
