# /etc/sysconfig/ia-servidor — configuração do servidor de IA (/etc/rc.d/init.d/ia-servidor)
# O servidor só escuta em 127.0.0.1 (acesso local). Não arranca no boot por omissão.
MODELO=/usr/share/ia/modelos/predefinido.gguf
ENDERECO=127.0.0.1
PORTA=8080
CONTEXTO=4096
# THREADS vazio = núcleos físicos
THREADS=
UTILIZADOR=nobody
REGISTO=/var/log/ia-servidor.log
# opções extra do llama-server (ex.: ARGS="--parallel 2")
ARGS=
