# ianinjapelagestao: ecrã de início de sessão (lightdm-gtk-greeter 2.0.9), ao estilo do macOS:
# papel de parede da distro, caixa de entrada centrada e translúcida (ver
# /var/lib/lightdm/.config/gtk-3.0/gtk.css), barra superior discreta com o relógio.
# Opções descritas no ficheiro original do pacote (data/lightdm-gtk-greeter.conf).
[greeter]
background = /usr/share/backgrounds/ianinja/ianinja-claro.svg
user-background = false
transition-duration = 300
theme-name = WhiteSur-Light
icon-theme-name = WhiteSur-light
cursor-theme-name = WhiteSur-cursors
cursor-theme-size = 24
font-name = Inter 11
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = none
position = 50%,center 45%,center
default-user-image = #avatar-default-symbolic
round-user-image = true
hide-user-image = false
highlight-logged-user = true
panel-position = top
clock-format = %a %d %b  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~layout;~language;~session;~a11y;~power
screensaver-timeout = 60
