# ianinjapelagestao: definições GTK 3 para todo o sistema (aplicações GTK fora de uma sessão Xfce;
# dentro do Xfce prevalece o xfsettingsd, com os mesmos valores — ver xsettings.xml).
[Settings]
gtk-theme-name = WhiteSur-Light
gtk-icon-theme-name = WhiteSur-light
gtk-cursor-theme-name = WhiteSur-cursors
gtk-cursor-theme-size = 24
gtk-font-name = Inter 10
gtk-application-prefer-dark-theme = false
gtk-decoration-layout = close,minimize,maximize:menu
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight
gtk-xft-rgba = none
gtk-enable-animations = true
gtk-sound-theme-name = freedesktop
