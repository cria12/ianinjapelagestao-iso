<?xml version="1.0" encoding="UTF-8"?>
<!-- Ícone da Loja do ianinjapelagestao (desenho original, licença igual à do projeto):
     um saco de compras com uma seta de transferência, sobre um quadrado arredondado azul-violeta. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9bff"/>
      <stop offset="0.6" stop-color="#5b5cff"/>
      <stop offset="1" stop-color="#9a4dff"/>
    </linearGradient>
    <linearGradient id="saco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1a1060" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#fundo)"/>
  <rect x="6" y="6" width="116" height="58" rx="27" fill="#ffffff" opacity="0.08"/>
  <g filter="url(#sombra)">
    <path d="M46 46 v-6 a18 18 0 0 1 36 0 v6" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M33 46 h62 a4 4 0 0 1 4 4.3 l-3.6 46 a7 7 0 0 1 -7 6.7 h-48.8 a7 7 0 0 1 -7 -6.7 l-3.6 -46 a4 4 0 0 1 4 -4.3 z"
          fill="url(#saco)"/>
  </g>
  <path d="M64 60 v24 M53 74 l11 11 l11 -11" fill="none" stroke="#4f63ff" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
