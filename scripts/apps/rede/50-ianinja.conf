# ianinjapelagestao — /etc/NetworkManager/conf.d/50-ianinja.conf (scripts/apps/rede/, bloco 8 da F8e)
# Ver scripts/apps/decisoes-08.txt.
[main]
# o /etc/resolv.conf é um ficheiro normal (antes escrito pelo dhcpcd): o NetworkManager reescreve-o
rc-manager=file

[device]
# endereço MAC aleatório durante a procura de redes: alguns adaptadores USB (rtl8xxxu, rtw88_usb,
# mt7601u) deixam de encontrar redes ou de ligar com ele
wifi.scan-rand-mac-address=no

[connection]
# poupança de energia do Wi-Fi desligada (2 = disable): com ela os adaptadores USB e vários
# Realtek/MediaTek perdem a ligação ou ficam lentos; o custo em bateria é pequeno
wifi.powersave=2
